[Sprint]
; Клавиша спринта (код Virtual-Key, в ДЕСЯТИЧНОМ виде):
;   20 = CapsLock, 160 = Left Shift, 162 = Left Ctrl, 9 = Tab, 88 = X, 86 = V, 66 = B
Key=20

; Режим: 1 = тоггл (нажал — включил, нажал — выключил), 0 = удерживание
Toggle=1

; Во сколько раз ускорять ходьбу/бег
Multiplier=1.7

; Адрес walk-скорости в памяти (абсолютный VA). 0 = искать автоматически.
; Если автопоиск не сработает (см. Sprint.log) — найдём в Cheat Engine и впишем сюда, напр. 0x6F1234
ManualWalkVA=0
